name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test:run    # компонентные тесты (Vitest + RTL + MSW)
      - run: npm run build       # ловит ошибки, которые прощает dev-сервер
        env:
          VITE_API_URL: https://example.invalid/api   # для проверки сборки адрес не важен
