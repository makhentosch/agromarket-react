name: E2E smoke (production)

# Полные E2E пишут в базу, поэтому на продакшене только @smoke: они ничего не меняют
on:
  workflow_dispatch:          # кнопка Run workflow
  schedule:
    - cron: '0 4 * * *'       # ежедневно 04:00 UTC (09:00 в Астане)

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
